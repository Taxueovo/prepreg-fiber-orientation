<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Prepreg Fiber Orientation Estimation banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a19"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <pattern id="fibers" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(11)">
      <g stroke="#ffffff" stroke-opacity="0.055" stroke-width="1.6" stroke-linecap="round">
        <line x1="0" y1="10" x2="66" y2="15"/>
        <line x1="4" y1="36" x2="70" y2="40"/>
        <line x1="0" y1="62" x2="64" y2="66"/>
      </g>
      <line x1="8" y1="22" x2="58" y2="27" stroke="#c98500" stroke-opacity="0.10" stroke-width="1.8" stroke-linecap="round"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#fibers)"/>

  <!-- left: text block -->
  <text x="80" y="168" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" letter-spacing="5" fill="#c98500" font-weight="600">CARBON-FIBER PREPREG</text>
  <text x="80" y="248" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="58" font-weight="700" fill="#ffffff">Fiber Orientation</text>
  <text x="80" y="316" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="58" font-weight="700" fill="#ffffff">Estimation</text>

  <text x="80" y="382" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" fill="#c3c2b7" letter-spacing="0.2">
    Deep regression of the acute surface-fiber orientation angle on
  </text>
  <text x="80" y="414" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" fill="#c3c2b7" letter-spacing="0.2">
    carbon-fiber prepreg, with uncertainty-aware prediction and a
  </text>
  <text x="80" y="446" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" fill="#c3c2b7" letter-spacing="0.2">
    classical Gradient Structure Tensor baseline.
  </text>

  <!-- pills -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#c3c2b7">
    <rect x="80" y="490" width="118" height="38" rx="19" fill="#1a1a19" stroke="#383835" stroke-width="1"/>
    <text x="139" y="515" text-anchor="middle">PyTorch</text>
    <rect x="210" y="490" width="176" height="38" rx="19" fill="#1a1a19" stroke="#383835" stroke-width="1"/>
    <text x="298" y="515" text-anchor="middle">ConvNeXt-Tiny</text>
    <rect x="398" y="490" width="118" height="38" rx="19" fill="#1a1a19" stroke="#383835" stroke-width="1"/>
    <text x="457" y="515" text-anchor="middle">DINOv3</text>
    <rect x="528" y="490" width="150" height="38" rx="19" fill="#1a1a19" stroke="#383835" stroke-width="1"/>
    <text x="603" y="515" text-anchor="middle">Uncertainty</text>
  </g>

  <text x="80" y="596" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#898781" letter-spacing="0.5">
    Sanitized research release · MIT License · E01–E08 reproducibility protocols
  </text>

  <!-- right: acute-angle diagram -->
  <g>
    <!-- reference line -->
    <line x1="830" y1="392" x2="1172" y2="392" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" stroke-linecap="round"/>
    <text x="872" y="382" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#898781">reference</text>

    <!-- fiber-direction line -->
    <line x1="1000" y1="392" x2="1118" y2="300" stroke="#c98500" stroke-width="5" stroke-linecap="round"/>
    <text x="1126" y="306" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#c3c2b7">fiber</text>

    <!-- angle arc -->
    <path d="M 1063.0 342.7 A 80 80 0 0 1 1080 392" fill="none" stroke="#c3c2b7" stroke-width="2.5"/>
    <text x="1016" y="338" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="600" fill="#c98500">θ</text>

    <text x="1000" y="470" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#c3c2b7">acute angle θ ∈ [0°, 90°]</text>
  </g>
</svg>
